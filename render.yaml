services:
  - type: web
    name: salon-admin-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-admin-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    disk:
      name: uploads-storage
      mountPath: /opt/render/project/src/src/uploads
      sizeGB: 1

databases:
  - name: salon-admin-db
    plan: free
